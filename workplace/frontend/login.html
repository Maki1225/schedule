
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ログイン - Schedule App</title>

  <link rel="stylesheet" href="css/auth.css">

  <!-- Googleログイン -->
  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
  <script>window.API_BASE_URL = "/";</script>
<script src="js/login.js" defer></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">

      <h1>Schedule App</h1>
      <h2>ログイン</h2>

      <p class="login-description">
        Googleアカウントを使用してログインしてください。
      </p>

      <div
        id="g_id_onload"
        data-client_id="1067955587484-jiuifljib05r35bfj25orgjucl2ctjbe.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
      </div>

      <div class="google-login">
        <!--
          g_id_onload / g_id_signin を削除し、
          JavaScript (Code Client) から呼び出す独自ボタンに変更
        -->
        <button type="button" class="google-btn" onclick="loginWithGoogle()">
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" style="width: 20px; vertical-align: middle; margin-right: 8px;">
          Googleでログイン
        </button>
      </div>

      <p id="login-error" class="error-message"></p>

      <p style="margin-top: 25px;">
        <a href="index.html">ホームページに戻る</a>
      </p>

    </div>
  </div>

</body>
</html>
